name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Check the package lists its licence, sprite and drawings
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "const f = require('./pack.json')[0].files.map((x) => x.path); for (const p of ['LICENSE', 'dist/sprite.svg', 'dist/index.js', 'dist/names.js', 'icons/Arrow_Down_LG.svg']) if (!f.includes(p)) { console.error('missing ' + p); process.exit(1); }"
